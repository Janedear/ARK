<div id="status-bar">
  <span class="ark-brand" aria-label="ARK, by HaloSuite"><span class="brand-ark"><svg aria-hidden="true"><use href="#i-ark-roof"/></svg>ARK</span><small class="brand-by">by HaloSuite</small></span>
  <span class="status-item"><span class="conn-pill conn-offline" id="conn-pill" onclick="UI.showConnStatus()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();UI.showConnStatus()}" role="button" tabindex="0" style="cursor:pointer" title="Not connected to any hub. Tap for connection details" aria-live="polite" aria-label="Connection: OFFLINE. Show connection details">OFFLINE</span></span>
  <span class="status-item sb-extra"><span class="status-dot dot-grey" id="gps-dot" title="GPS: grey = off, green = location acquired" aria-hidden="true"></span><span id="gps-status" aria-live="polite">GPS off</span></span>
  <span class="status-item sb-extra" id="batt-item" title="Battery level" style="display:none"><span id="batt-icon" aria-hidden="true"><svg class="hi"><use href="#i-battery"/></svg></span> <span id="batt-level">--</span></span>
  <span class="status-item sb-extra" style="margin-left:auto"><svg class="hi" aria-hidden="true"><use href="#i-clock"/></svg> <span id="sb-time">--:--</span></span>
  <span class="status-item" id="offline-indicator" role="status" title="This device has no internet connection. ARK still works." style="color:var(--yellow)"></span>
  <button class="btn btn-secondary btn-sm" onclick="UI.shareApp()" aria-label="Save and share ARK" title="Save and share ARK"><svg class="hi" aria-hidden="true"><use href="#i-share"/></svg><span class="sb-label"> Save &amp; Share ARK</span></button>
  <button class="sb-gear" onclick="UI.switchTab('settings')" aria-label="Settings" title="Settings"><svg class="hi" aria-hidden="true"><use href="#i-gear"/></svg></button>
</div>
