<div id="status-bar">
  <span class="ark-brand" aria-label="ARK, by HaloSuite"><span class="brand-ark"><svg aria-hidden="true"><use href="#i-ark-roof"/></svg>ARK</span><small class="brand-by">by HaloSuite</small></span>
  <span class="status-item"><span class="conn-pill conn-offline" id="conn-pill" onclick="UI.showConnStatus()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();UI.showConnStatus()}" role="button" tabindex="0" style="cursor:pointer" title="Not connected to any hub. Tap for connection details" aria-live="polite" aria-label="Connection: OFFLINE. Show connection details">OFFLINE</span></span>

  <span class="status-item sb-extra" style="margin-left:auto">🕐 <span id="sb-time">--:--</span></span>
  <span class="status-item" id="offline-indicator" style="color:var(--yellow)"></span>
  <button class="btn btn-secondary btn-sm" onclick="UI.shareApp()" style="padding:3px 10px;min-height:0;font-size:11px;font-weight:700;border-radius:8px"><span aria-hidden="true">📥</span><span class="sb-label"> Save &amp; Share ARK</span></button>
  <button class="sb-gear" onclick="UI.switchTab('settings')" aria-label="Settings" title="Settings"><svg class="hi" aria-hidden="true"><use href="#i-gear"/></svg></button>
</div>
